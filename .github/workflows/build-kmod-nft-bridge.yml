name: Build kmod-nft-bridge only

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.1

jobs:
  build-kmod:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup Swap
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig curl wget file unzip zlib1g-dev \
            libelf-dev libudev-dev cmake ccache
          free -h; df -h /
          sudo swapoff -a 2>/dev/null; sleep 1
          SWAPFILE="$(mktemp -p /tmp -u).swap"
          sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=4096 2>&1
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          free -h

      - name: Clone ImmortalWrt
        run: |
          git clone ${{ env.REPO_URL }} --depth=1 -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          cat > feeds.conf << 'EOF'
          src-git packages https://github.com/immortalwrt/packages.git^e93a938c63124832d549c41da3157e2ec40fbe05
          src-git luci https://github.com/immortalwrt/luci.git^ed7692cb08a953e2e503287e0337c8b548cf4ba5
          src-git routing https://github.com/openwrt/routing.git^76c933906c616a4cdf865611af0a381787bd87b8
          src-git telephony https://github.com/openwrt/telephony.git^2618106d5846a4a542fdf5809f0d3ed228ce439b
          src-git video https://github.com/openwrt/video.git^094bf58da6682f895255a35a84349a79dab4bf95
          src-git qmodem https://github.com/FUjr/QModem.git^main
          src-git daed https://github.com/QiuSimons/luci-app-daed
          EOF

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target & Package
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_arcadyan_aw1000=y
          CONFIG_PACKAGE_kmod-nft-bridge=y
          EOF
          make defconfig

      - name: Download Sources
        run: cd openwrt && make download -j4

      - name: Build Toolchain
        run: cd openwrt && make tools/install -j2 && make toolchain/install -j2

      - name: Build kmod-nft-bridge
        run: |
          cd openwrt
          make package/kmod-nft-bridge/compile V=s -j$(nproc) 2>&1 || make package/kmod-nft-bridge/compile V=s -j1
          for p in kmod-nft-bridge kmod-nft-core kmod-nft-compat kmod-nft-offload kmod-nft-fib; do
            make package/$p/compile V=s -j$(nproc) 2>/dev/null || true
          done

      - name: Upload kmod-nft-bridge apk
        uses: actions/upload-artifact@v4
        with:
          name: kmod-nft-bridge
          path: |
            openwrt/bin/packages/*/kernel/kmod-nft-bridge*.apk
            openwrt/bin/packages/*/kernel/kmod-nft-core*.apk
            openwrt/bin/packages/*/kernel/kmod-nft-compat*.apk
          retention-days: 7
